<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Database - TMDB</title>
    <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
    <!-- Header with Filters and Controls -->
    <header class="header">
        <div class="header-container">
            <!-- Filter Dropdowns (Dark Grey) -->
            <div class="filter-controls">
                <!-- Genre Filter -->
                <select id="genreFilter" class="filter-dropdown" title="Genre">
                    <option value="">Genre</option>
                    <option value="28">Actie</option>
                    <option value="12">Avontuur</option>
                    <option value="16">Animatie</option>
                    <option value="35">Komedie</option>
                    <option value="80">Misdaad</option>
                    <option value="99">Documentaire</option>
                    <option value="18">Drama</option>
                    <option value="10751">Familie</option>
                    <option value="14">Fantasy</option>
                    <option value="36">Historie</option>
                    <option value="27">Horror</option>
                    <option value="10402">Muziek</option>
                    <option value="9648">Mystery</option>
                    <option value="10749">Romantiek</option>
                    <option value="878">Sci-Fi</option>
                    <option value="53">Thriller</option>
                    <option value="10752">Oorlog</option>
                    <option value="37">Western</option>
                </select>

                <!-- Year Filter -->
                <select id="yearFilter" class="filter-dropdown" title="Jaar">
                    <option value="">Jaar</option>
                    <option value="2025">2025</option>
                    <option value="2024">2024</option>
                    <option value="2023">2023</option>
                    <option value="2022">2022</option>
                    <option value="2021">2021</option>
                    <option value="2020">2020</option>
                    <option value="2019">2019</option>
                    <option value="2018">2018</option>
                </select>

                <!-- Rating Filter -->
                <select id="ratingFilter" class="filter-dropdown" title="Beoordeling">
                    <option value="">Beoordeling</option>
                    <option value="9">9+ ⭐</option>
                    <option value="8">8+ ⭐</option>
                    <option value="7">7+ ⭐</option>
                    <option value="6">6+ ⭐</option>
                    <option value="5">5+ ⭐</option>
                </select>

                <!-- Sort Filter -->
                <select id="sortFilter" class="filter-dropdown" title="Sorteren">
                    <option value="popularity">Populariteit</option>
                    <option value="rating">Beoordeling</option>
                    <option value="release_date">Nieuwste</option>
                    <option value="title">Alfabetisch</option>
                </select>
                

                <!-- Certification Filter -->
                <select id="certificationFilter" class="filter-dropdown" title="Certificatie (Leeftijdsclassificatie)">
                    <option value="">Certificatie</option>
                    <option value="G">G - Iedereen</option>
                    <option value="PG">PG - Ouders worden geadviseerd</option>
                    <option value="PG-13">PG-13 - 13+ aanbevolen</option>
                    <option value="R">R - 17+ aanbevolen</option>
                    <option value="NC-17">NC-17 - 18+ alleen</option>
                    <option value="AL">AL - Alle leeftijden (NL)</option>
                    <option value="6">6+ (NL)</option>
                    <option value="12">12+ (NL)</option>
                    <option value="16">16+ (NL)</option>
                </select>
            </div>

            <!-- Search Box (Light Grey) -->
            <div class="search-box">
                <input type="text" id="searchInput" class="search-input" placeholder="Zoek films...">
                <span class="search-icon">🔍</span>
            </div>

            <!-- Favorites Star (Red) -->
            <button id="favoritesBtn" class="favorites-star" title="Favorieten">⭐</button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="container">
        <!-- Single Featured Movie Card -->
        <section class="featured-section">
            <h2>Aanbevolen Film</h2>
            <div id="featuredMovieContainer" class="featured-movie-card">
                <div class="loading">Film laden...</div>
            </div>
        </section>

        <!-- Content Area -->
        <section class="content">
            <!-- Movies Grid -->
            <div id="moviesContainer" class="movies-grid">
            <!-- Movies zullen hier geladen worden -->
            <div class="loading">Films laden...</div>
        </div>

        <!-- Pagination Controls -->
        <div id="paginationContainer" class="pagination-controls">
            <button id="prevPageBtn" class="pagination-btn" title="Vorige pagina">← Vorige</button>
            
            <div class="pagination-info">
                <span id="pageInfo">Pagina 1 van 1</span>
            </div>

            <div class="pagination-jump">
                <input type="number" id="pageInput" class="page-input" min="1" value="1" placeholder="Pag.">
                <button id="goPageBtn" class="go-btn" title="Ga naar pagina">Ga</button>
            </div>

            <button id="nextPageBtn" class="pagination-btn" title="Volgende pagina">Volgende →</button>
        </div>
    </section>
</main>

<!-- Footer -->
<footer class="footer">
    <p>&copy; 2025 MovieDB. Powered by <a href="https://www.themoviedb.org/" target="_blank">TMDB API</a></p>
</body>
</html>
